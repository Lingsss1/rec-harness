name: KuaiRand long-sequence CPU

on:
  push:
    branches: [main]
    paths:
      - 'benchmarks/kuairand-longseq/**'
      - '.github/workflows/kuairand-longseq-cpu.yml'
  pull_request:
    paths:
      - 'benchmarks/kuairand-longseq/**'
      - '.github/workflows/kuairand-longseq-cpu.yml'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: benchmarks/kuairand-longseq

jobs:
  correctness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install torch==2.2.2 --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -e '.[test]'
      - run: python scripts/fetch_sources.py
      - run: python -m unittest discover -s tests -v
      - run: |
          bash -n scripts/oneclick_a800.sh scripts/run_a800.sh
          bash scripts/oneclick_a800.sh --help
      - run: |
          for model in hstu ultra_hstu dare ccformer; do
            python -m longseq_bench.train --model "$model" --device cpu --smoke --output "runs/$model"
          done
          python scripts/summarize.py runs --include-smoke --require-complete
