[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "longseq-kuairand-bench"
version = "0.1.0"
description = "FuXi-Linear-aligned KuaiRand-27K benchmark for HSTU and adapted ULTRA-HSTU, DARE and CCFormer"
requires-python = ">=3.9"
license = {text = "Apache-2.0"}
dependencies = ["torch>=2.2,<2.6", "numpy>=1.26,<2", "pandas>=2.2,<2.3"]

[project.optional-dependencies]
test = ["gin-config==0.5.0", "einops==0.8.1", "tqdm>=4.66"]

[tool.setuptools.packages.find]
include = ["longseq_bench*"]
