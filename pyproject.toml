[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rec-harness"
version = "0.1.0"
description = "Evidence-gated research runtime with direct Codex agents"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
rec-harness = "rec_harness.cli:main"

[tool.setuptools.packages.find]
include = ["rec_harness*"]

[tool.setuptools.package-data]
rec_harness = ["native/*.c"]
