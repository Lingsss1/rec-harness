[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "staged-autoresearch"
version = "0.1.0"
description = "Budgeted native-agent experiments with prospective plans and fresh-context reviews"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
staged-autoresearch = "staged_research.cli:main"

[tool.setuptools.packages.find]
include = ["staged_research*"]

[tool.setuptools.package-data]
staged_research = ["resources/*"]
